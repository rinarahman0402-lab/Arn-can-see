<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>arn can see</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: monospace, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        #ui-bar {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            color: #00ff88;
            display: flex;
            justify-content: space-between;
            background: #111;
            border-bottom: 2px solid #333;
        }
        #game-container {
            position: relative;
            width: 95vw;
            height: 95vw;
            max-width: 450px;
            max-height: 450px;
            background-color: #111115;
            border: 2px solid #333;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #cutscene-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            z-index: 10;
            text-align: center;
        }
        #typed-text {
            font-size: 18px;
            line-height: 1.4;
            color: #00ff66;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }
        #start-btn {
            background-color: #00ff88;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .hidden {
            display: none !important;
        }
        
        /* Mobile Touch Controls */
        #touch-controls {
            width: 100%;
            max-width: 320px;
            height: 180px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .btn {
            background-color: #22222a;
            border: 2px solid #555;
            color: #fff;
            font-size: 24px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn:active {
            background-color: #00ff88;
            color: #000;
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
        #btn-right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

    <div id="ui-bar">
        <span id="level-display">Level: 1/8</span>
        <span id="objective-display">Objective: Collect 1 Battery</span>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="cutscene-screen">
            <div id="typed-text">Level 1 out of 8&#10;&#10;arn can see.</div>
            <button id="start-btn">TAP TO PLAY</button>
        </div>
    </div>
    
    <div id="touch-controls">
        <div class="btn" id="btn-up">▲</div>
        <div class="btn" id="btn-left">◄</div>
        <div class="btn" id="btn-down">▼</div>
        <div class="btn" id="btn-right">►</div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const cutsceneScreen = document.getElementById('cutscene-screen');
const typedTextEl = document.getElementById('typed-text');
const startBtn = document.getElementById('start-btn');
const levelDisplay = document.getElementById('level-display');
const objectiveDisplay = document.getElementById('objective-display');

const LEVEL_TEXTS = {
    1: "Level 1 out of 8\n\narn can see.",
    2: "Level 2 out of 8\n\narn can walk.",
    3: "Level 3 out of 8\n\narn can run.",
    4: "Level 4 out of 8\n\narn can sense heartbeat.",
    5: "Level 5 out of 8\n\narn can lay traps.",
    6: "Level 6 out of 8\n\narn can teleport.",
    7: "Level 7 out of 8\n\narn can duplicate.",
    8: "Level 8 out of 8\n\narn can see... and arn can die.\n\nGather 8 pieces of wood to build a giant campfire in the center, then lure Arn into it.",
    9: "VICTORY!\n\nArn stepped into the flames.\n\nGoodbye, arn."
};

const GRID_SIZE = 15;
const TILE_SIZE = 400 / GRID_SIZE; // Fits perfectly into 400px canvas
let currentLevel = 1;
let gameState = 'CUTSCENE';
let grid = [];
let keys = {};

let player = { x: 0, y: 0, speed: 2.5, radius: 8 };
let arns = [];
let batteries = [];
let woods = [];
let traps = [];
let campfire = null;

let touchDirs = { up: false, down: false, left: false, right: false };

function bindTouch(id, dir) {
    const el = document.getElementById(id);
    const press = (e) => { e.preventDefault(); touchDirs[dir] = true; };
    const release = (e) => { e.preventDefault(); touchDirs[dir] = false; };
    el.addEventListener('touchstart', press);
    el.addEventListener('touchend', release);
    el.addEventListener('mousedown', press);
    el.addEventListener('mouseup', release);
}
bindTouch('btn-up', 'up');
bindTouch('btn-down', 'down');
bindTouch('btn-left', 'left');
bindTouch('btn-right', 'right');

window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

startBtn.addEventListener('click', advanceState);
startBtn.addEventListener('touchstart', (e) => { e.preventDefault(); advanceState(); });

function playCutscene(text) {
    gameState = 'CUTSCENE';
    typedTextEl.textContent = text;
    cutsceneScreen.classList.remove('hidden');
}

function advanceState() {
    if (currentLevel > 8) currentLevel = 1;
    cutsceneScreen.classList.add('hidden');
    startLevel(currentLevel);
}

function generateLabyrinth() {
    grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(1));

    // Simple grid layout to guarantee path stability on mobile
    for (let r = 1; r < GRID_SIZE - 1; r++) {
        for (let c = 1; c < GRID_SIZE - 1; c++) {
            if (r % 2 !== 0 || c % 2 !== 0) {
                grid[r][c] = 0;
            }
        }
    }

    // Elevator Room at Center
    const mid = Math.floor(GRID_SIZE / 2);
    for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
            grid[mid + dy][mid + dx] = 0;
        }
    }
}

function startLevel(lvl) {
    currentLevel = lvl;
    levelDisplay.textContent = `Level: ${currentLevel}/8`;
    
    generateLabyrinth();

    const centerPx = (Math.floor(GRID_SIZE / 2) + 0.5) * TILE_SIZE;
    player.x = centerPx;
    player.y = centerPx;

    batteries = [];
    woods = [];
    arns = [];
    traps = [];
    campfire = null;

    if (lvl < 8) {
        objectiveDisplay.textContent = `Objective: Collect ${lvl} Battery`;
        for (let i = 0; i < lvl; i++) {
            let pos = getRandomEmptyTile();
            batteries.push({ x: (pos.x + 0.5) * TILE_SIZE, y: (pos.y + 0.5) * TILE_SIZE, collected: false });
        }
    } else {
        objectiveDisplay.textContent = `Objective: Collect 8 Wood Logs`;
        for (let i = 0; i < 8; i++) {
            let pos = getRandomEmptyTile();
            woods.push({ x: (pos.x + 0.5) * TILE_SIZE, y: (pos.y + 0.5) * TILE_SIZE, collected: false });
        }
    }

    const numArns = (lvl === 7 || lvl === 8) ? 2 : 1;
    for (let i = 0; i < numArns; i++) {
        let pos = getRandomEmptyTile(true);
        arns.push({
            x: (pos.x + 0.5) * TILE_SIZE,
            y: (pos.y + 0.5) * TILE_SIZE,
            angle: 0,
            speed: lvl === 1 ? 0 : (lvl === 2 ? 0.8 : (lvl >= 3 ? 1.8 : 1.4)),
            trapCooldown: 0,
            teleportCooldown: 0
        });
    }

    gameState = 'PLAYING';
}

function getRandomEmptyTile(awayFromCenter = false) {
    const mid = Math.floor(GRID_SIZE / 2);
    while (true) {
        let x = Math.floor(Math.random() * (GRID_SIZE - 2)) + 1;
        let y = Math.floor(Math.random() * (GRID_SIZE - 2)) + 1;
        if (grid[y][x] === 0) {
            if (awayFromCenter && Math.abs(x - mid) < 3 && Math.abs(y - mid) < 3) continue;
            return { x, y };
        }
    }
}

function update() {
    if (gameState !== 'PLAYING') return;

    let dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp'] || touchDirs.up) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown'] || touchDirs.down) dy += 1;
    if (keys['KeyA'] || keys['ArrowLeft'] || touchDirs.left) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight'] || touchDirs.right) dx += 1;

    if (dx !== 0 && dy !== 0) {
        dx *= 0.7071;
        dy *= 0.7071;
    }

    moveWithCollision(player, dx * player.speed, dy * player.speed);

    // Traps
    for (let i = traps.length - 1; i >= 0; i--) {
        let t = traps[i];
        if (Math.hypot(player.x - t.x, player.y - t.y) < player.radius + 6) {
            player.speed = 1.0;
            setTimeout(() => { player.speed = 2.5; }, 1500);
            traps.splice(i, 1);
        }
    }

    // Items
    if (currentLevel < 8) {
        batteries.forEach(b => {
            if (!b.collected && Math.hypot(player.x - b.x, player.y - b.y) < player.radius + 10) {
                b.collected = true;
            }
        });

        let remaining = batteries.filter(b => !b.collected).length;
        if (remaining === 0) {
            const midPx = (Math.floor(GRID_SIZE / 2) + 0.5) * TILE_SIZE;
            if (Math.hypot(player.x - midPx, player.y - midPx) < 30) {
                currentLevel++;
                playCutscene(LEVEL_TEXTS[currentLevel]);
            }
        }
    } else {
        woods.forEach(w => {
            if (!w.collected && Math.hypot(player.x - w.x, player.y - w.y) < player.radius + 10) {
                w.collected = true;
            }
        });

        let woodsLeft = woods.filter(w => !w.collected).length;
        if (woodsLeft === 0 && !campfire) {
            const midPx = (Math.floor(GRID_SIZE / 2) + 0.5) * TILE_SIZE;
            campfire = { x: midPx, y: midPx };
            objectiveDisplay.textContent = "Lure Arn into Campfire!";
        }

        if (campfire) {
            arns.forEach(arn => {
                if (Math.hypot(arn.x - campfire.x, arn.y - campfire.y) < 35) {
                    currentLevel = 9;
                    playCutscene(LEVEL_TEXTS[9]);
                }
            });
        }
    }

    // Arn AI
    arns.forEach(arn => {
        let seesPlayer = true; // Simplified line-of-sight for stability

        if (currentLevel === 1) {
            arn.angle = Math.atan2(player.y - arn.y, player.x - arn.x);
            return;
        }

        if (currentLevel >= 6) {
            arn.teleportCooldown++;
            if (arn.teleportCooldown > 350) {
                arn.teleportCooldown = 0;
                let nearTile = getRandomEmptyTile();
                arn.x = (nearTile.x + 0.5) * TILE_SIZE;
                arn.y = (nearTile.y + 0.5) * TILE_SIZE;
            }
        }

        if (currentLevel >= 5) {
            arn.trapCooldown++;
            if (arn.trapCooldown > 200) {
                arn.trapCooldown = 0;
                traps.push({ x: arn.x, y: arn.y });
            }
        }

        arn.angle = Math.atan2(player.y - arn.y, player.x - arn.x);
        let moveX = Math.cos(arn.angle) * arn.speed;
        let moveY = Math.sin(arn.angle) * arn.speed;
        moveWithCollision(arn, moveX, moveY);

        if (currentLevel >= 2) {
            if (Math.hypot(player.x - arn.x, player.y - arn.y) < player.radius + 10) {
                playCutscene(`arn caught you...\n\nRestarting Level ${currentLevel}...`);
            }
        }
    });
}

function moveWithCollision(entity, vx, vy) {
    let nextX = entity.x + vx;
    let nextY = entity.y + vy;
    let r = 6;

    let tileX = Math.floor((nextX + Math.sign(vx) * r) / TILE_SIZE);
    let currentTileY = Math.floor(entity.y / TILE_SIZE);
    if (grid[currentTileY] && grid[currentTileY][tileX] === 0) entity.x = nextX;

    let tileY = Math.floor((nextY + Math.sign(vy) * r) / TILE_SIZE);
    let currentTileX = Math.floor(entity.x / TILE_SIZE);
    if (grid[tileY] && grid[tileY][currentTileX] === 0) entity.y = nextY;
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const mid = Math.floor(GRID_SIZE / 2);
    for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
            if (grid[r][c] === 1) {
                ctx.fillStyle = '#22232a';
                ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            } else {
                if (Math.abs(r - mid) <= 1 && Math.abs(c - mid) <= 1) {
                    ctx.fillStyle = '#3a2d1d';
                } else {
                    ctx.fillStyle = '#0a0a0c';
                }
                ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            }
        }
    }

    ctx.strokeStyle = '#ffaa00';
    ctx.lineWidth = 2;
    ctx.strokeRect((mid - 1) * TILE_SIZE, (mid - 1) * TILE_SIZE, TILE_SIZE * 3, TILE_SIZE * 3);

    traps.forEach(t => {
        ctx.fillStyle = '#ff0055';
        ctx.beginPath();
        ctx.arc(t.x, t.y, 4, 0, Math.PI * 2);
        ctx.fill();
    });

    if (campfire) {
        ctx.fillStyle = '#ff6600';
        ctx.beginPath();
        ctx.arc(campfire.x, campfire.y, 18, 0, Math.PI * 2);
        ctx.fill();
    }

    batteries.forEach(b => {
        if (!b.collected) {
            ctx.fillStyle = '#00e5ff';
            ctx.fillRect(b.x - 4, b.y - 7, 8, 14);
        }
    });

    woods.forEach(w => {
        if (!w.collected) {
            ctx.fillStyle = '#8b5a2b';
            ctx.fillRect(w.x - 6, w.y - 3, 12, 6);
        }
    });

    // Player (Green Circle)
    ctx.fillStyle = '#00ff88';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fill();

    // Arn
    arns.forEach(arn => {
        drawArn(arn);
    });
}

function drawArn(arn) {
    ctx.save();
    ctx.translate(arn.x, arn.y);

    ctx.strokeStyle = '#ff3333';
    ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
        let legAngle = (i / 8) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(legAngle) * 14, Math.sin(legAngle) * 14);
        ctx.stroke();
    }

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI * 2);
    ctx.fill();

    let pupilX = Math.cos(arn.angle) * 3;
    let pupilY = Math.sin(arn.angle) * 3;

    ctx.fillStyle = '#ff0000';
    ctx.beginPath();
    ctx.arc(pupilX, pupilY, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function loop() {
    update();
    render();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
